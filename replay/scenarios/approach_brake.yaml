# Replay scenario: approach and brake, then clear again
# P1: a SENSOR_DIST < 300 cm observation must be answered by CMD_BRAKE > 0
#     within the latency budget (default 300 ms).
name: approach_brake
description: "18 m -> 1.5 m at 600 ms (brake ramp), clear again at 1200 ms"
duration_ms: 1800

signals:
  - id: SENSOR_DIST
    period_ms: 20
    steps:
      - {at_ms: 0,    value: 1800}   # clear
      - {at_ms: 600,  value: 150}    # hazard range + ramp: (300-150)/3 = 50 %
      - {at_ms: 1200, value: 1800}   # road clear again -> brake must release

  - id: SENSOR_SPEED
    period_ms: 100
    steps:
      - {at_ms: 0,    value: 800}    # 80.0 km/h
      - {at_ms: 600,  value: 300}    # 30.0 km/h (braking)
      - {at_ms: 1200, value: 800}    # accelerating again
