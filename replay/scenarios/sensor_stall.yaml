# Replay scenario: sensor data fault — the distance signal stalls mid-drive.
# The ECU must keep publishing CMD_BRAKE (P3 liveness) while holding the last
# known command; the staleness warning (age > 500 ms) is exercised on stderr.
name: sensor_stall
description: "braking distance feed stops at 600 ms (stale-data path)"
duration_ms: 1500

signals:
  - id: SENSOR_DIST
    period_ms: 20
    until_ms: 600                  # signal stalls: no more DIST frames after 600 ms
    steps:
      - {at_ms: 0,    value: 200}  # 2 m: braking must be commanded from the start

  - id: SENSOR_SPEED
    period_ms: 100
    until_ms: 600
    steps:
      - {at_ms: 0,    value: 400}
