name: ci

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Load vcan module & create interface
        run: sudo ./scripts/ci_setup_vcan.sh vcan0

      - name: Build
        run: make

      - name: Pytest (functional + performance on live vcan)
        run: python3 -m pytest tests/ -v --junitxml=reports/junit.xml

      - name: Demo run + analysis
        run: DUR=15 ./scripts/run_demo.sh

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports/

  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      - name: Run lint
        run: make lint

      - name: Layering gate (SWC/RTE include allowlist)
        run: python3 scripts/check_layering.py

      - name: Verify ID map artifacts
        run: python3 scripts/gen_idmap.py --check

  test-asan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Load vcan module & create interface
        run: sudo ./scripts/ci_setup_vcan.sh vcan0

      - name: Build with ASAN
        run: make asan

      - name: Pytest on ASAN build (functional + performance)
        run: python3 -m pytest tests/ -v --junitxml=reports/junit-asan.xml

      - name: Upload ASAN reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-asan
          path: reports/

  mutation:
    # Track A2 gate. Runs unconditionally on purpose: measured ~81 s of suite
    # time (job well under the 10-min budget), and a *silently skipped* quality
    # gate is worse than a cheap one that always reports.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Load vcan module & create interface
        run: sudo ./scripts/ci_setup_vcan.sh vcan0

      - name: Build
        run: make

      - name: Mutation run (seeded bugs, detection gate >= 90 %)
        run: make mutation

      - name: Show mutation summary
        if: always()
        run: |
          cat reports/mutation/mutation.md 2>/dev/null || true

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: reports/mutation/

  hil-replay:
    # Track A3 gate: scripted sensor timelines replayed onto a live vcan bus,
    # timing properties P1/P2/P3 checked against the observed actuator traffic.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Load vcan module & create interface
        run: sudo ./scripts/ci_setup_vcan.sh vcan0

      - name: Build
        run: make

      - name: HIL scenario replay suite (fresh ECU per scenario)
        run: ./scripts/replay_suite.sh vcan0

      - name: Upload replay reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: replay-reports
          path: reports/replay/
